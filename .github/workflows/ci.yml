name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & smoke-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pipx
        run: python -m pip install --upgrade pipx

      - name: Install skillbox
        run: pipx install -e .

      - name: Smoke test — version
        run: skillbox --help

      - name: Smoke test — ls (no skills installed; should not error)
        run: skillbox --no-splash ls --plain

      - name: Smoke test — plugins (no plugins; should not error)
        run: skillbox --no-splash plugins || true

      - name: Smoke test — audit (empty; should not error)
        run: skillbox --no-splash audit

      - name: Smoke test — help (in-app)
        run: skillbox --no-splash help

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check src/
      - name: Run ruff format check
        run: ruff format --check src/
